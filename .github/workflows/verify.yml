name: Repository verification
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  repository-verify:
    name: repository-verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        hermes-ref: ${{ github.event_name == 'schedule' && fromJSON('["v0.22.2", "main"]') || fromJSON('["v0.22.2"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build pinned test dependencies
        run: timeout --signal=TERM --kill-after=30s 1200s docker build --build-arg HERMES_REF=${{ matrix.hermes-ref }} -t outcome-loop-test -f docker/Dockerfile .
      - name: Run product tests in an isolated container
        run: |
          container="outcome-loop-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          timeout --signal=TERM --kill-after=10s 300s docker run --rm --init --pull=never \
            --name "$container" \
            --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --user=65532:65532 --cpus=2 --memory=2g --memory-swap=2g --pids-limit=256 \
            --tmpfs /scratch:rw,exec,nosuid,nodev,size=1g,mode=1777 \
            --mount type=bind,src="$PWD",dst=/source,readonly outcome-loop-test
