name: Repository verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  repository-verify:
    name: repository-verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # Deliberately fail until measured construction peaks are reviewed. A large
      # hosted runner or an image-size estimate is not a construction budget.
      - name: Admit public provisioning storage
        run: python3 scripts/docker_build_preflight.py --containerd-root /var/lib/containerd
      - name: Public-only pinned Hermes provisioning
        run: docker build --tag outcome-integration:ci --file docker/Dockerfile .
      - name: Required restricted native acceptance
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          HERMES_OUTCOME_IMAGE="$(docker image inspect outcome-integration:ci --format '{{.Id}}')"
          export HERMES_OUTCOME_IMAGE
          python3 scripts/verify.py
